name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  VULKAN_SDK_VERSION: "1.4.350.1"

jobs:
  linux-clang-debug:
    name: Linux Clang Debug
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install base tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            sccache \
            python3-pip \
            wget \
            software-properties-common \
            gnupg \
            libasound2-dev \
            libpulse-dev \
            libaudio-dev \
            libjack-dev \
            libsndio-dev \
            libx11-dev \
            libxext-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxfixes-dev \
            libxi-dev \
            libxss-dev \
            libxtst-dev \
            libxkbcommon-dev \
            libwayland-dev \
            wayland-protocols \
            libdecor-0-dev \
            libpipewire-0.3-dev \
            libegl1-mesa-dev \
            libgl1-mesa-dev

      - name: Install CMake 3.31
        run: |
          pip3 install --upgrade pip
          pip3 install cmake==3.31.6
          cmake --version

      - name: Install LLVM 22 + libc++
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main"
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang-22 \
            lld-22 \
            libc++-22-dev \
            libc++abi-22-dev \
            libunwind-dev
          # The runner may ship a preinstalled clang; force the versioned ones.
          sudo ln -sf /usr/bin/clang-22 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-22 /usr/bin/clang++
          sudo ln -sf /usr/bin/lld-22 /usr/bin/lld
          # CMake resolves clang++ to /usr/sbin/clang++ when precompiling std.pcm.
          sudo ln -sf /usr/bin/clang-22 /usr/sbin/clang
          sudo ln -sf /usr/bin/clang++-22 /usr/sbin/clang++
          # CMake/std module probing expects libc++ modules under /usr/share/libc++/v1,
          # but LLVM 22 packages install them under /usr/lib/llvm-22/share/libc++/v1.
          sudo mkdir -p /usr/share/libc++
          sudo ln -sf /usr/lib/llvm-22/share/libc++/v1 /usr/share/libc++/v1
          clang --version

      - name: Install Vulkan SDK
        uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          vulkan_version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true
          install_lavapipe: true

      - name: Configure sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ runner.os }}-${{ github.ref }}
          variant: sccache
          max-size: 2G

      - name: Configure
        run: cmake --preset linux-clang-debug-ci

      - name: Build
        run: cmake --build --preset linux-clang-debug-ci-build

      - name: Test
        run: ctest --preset linux-clang-debug-ci-tests -E "ProjectVRayTracedShadowTests"
