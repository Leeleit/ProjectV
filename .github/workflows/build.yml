name: Build & Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  VULKAN_SDK_VERSION: "1.4.350.1"

jobs:
  linux-clang-debug:
    name: Linux Clang Debug
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install base tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            ninja-build \
            sccache \
            python3-pip \
            wget \
            software-properties-common \
            gnupg

      - name: Install CMake 3.31
        run: |
          pip3 install --upgrade pip
          pip3 install cmake==3.31.0
          cmake --version

      - name: Install LLVM 22 + libc++
        run: |
          wget -qO- https://apt.llvm.org/llvm-snapshot.gpg.key | sudo tee /etc/apt/trusted.gpg.d/apt.llvm.org.asc
          sudo add-apt-repository "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main"
          sudo apt-get update
          sudo apt-get install -y \
            clang-22 \
            lld-22 \
            libc++-22-dev \
            libc++abi-22-dev
          sudo update-alternatives --install /usr/bin/clang clang /usr/bin/clang-22 100
          sudo update-alternatives --install /usr/bin/clang++ clang++ /usr/bin/clang++-22 100
          sudo update-alternatives --install /usr/bin/lld lld /usr/bin/lld-22 100
          clang --version

      - name: Install Vulkan SDK
        uses: KyleMayes/install-vulkan-action@v1.3.10
        with:
          version: ${{ env.VULKAN_SDK_VERSION }}
          cache: true

      - name: Configure sccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ github.job }}-${{ matrix.os }}-${{ github.ref }}
          variant: sccache
          max-size: 2G

      - name: Configure
        run: cmake --preset linux-clang-debug-ci

      - name: Build
        run: cmake --build --preset linux-clang-debug-ci-build

      - name: Test
        continue-on-error: true
        run: ctest --preset linux-clang-debug-ci-tests
